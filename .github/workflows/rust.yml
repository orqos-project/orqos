name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.99.0"

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Install pinned Rust toolchain
      run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt --component clippy
    - name: Format
      run: cargo fmt --check
    - name: Build
      run: cargo build --locked
    - name: Test
      run: cargo test --locked
    - name: Clippy
      run: cargo clippy --locked --all-targets -- -D warnings
    - name: Prepare Docker smoke image
      run: docker --context default pull alpine:3.22
    - name: Docker smoke checks
      run: python3 scripts/smoke.py --backend docker --docker-context default
