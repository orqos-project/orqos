name: Native Ubuntu release (draft)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev dpkg-dev
      - run: cargo test --locked
      - run: python3 -m unittest discover -s host -p 'test_*.py' -v
      - run: python3 -m unittest discover -s packaging -p 'test_*.py' -v
      - run: cargo build --release --locked
      - name: Package and check installation lifecycle
        run: |
          python3 packaging/build.py --tag "$RELEASE_TAG" --arch ${{ matrix.arch }}
          cp target/release/orqos dist/orqos-${{ matrix.target }}
          bash packaging/check-install.sh "$PWD/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: orqos-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/orqos-*-unknown-linux-gnu
  compatibility:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: orqos-${{ matrix.arch }}
          path: dist
      - name: Check Ubuntu 24.04 binaries on Ubuntu 26.04
        run: |
          sudo apt-get update
          python3 -m unittest discover -s host -p 'test_*.py' -v
          python3 -m unittest discover -s packaging -p 'test_*.py' -v
          bash packaging/check-install.sh "$PWD/dist"
  release:
    needs: [build, compatibility]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: orqos-*
          path: dist
          merge-multiple: true
      - name: Release manifest and checksums
        run: python3 packaging/release.py --tag "$RELEASE_TAG" --output dist
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.deb
            dist/orqos-*-unknown-linux-gnu
            dist/manifest.json
            dist/SHA256SUMS
      - name: Draft release for operator review
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes 'Native Ubuntu 24.04 and 26.04 packages and standalone binaries. Built on 24.04 and checked on both releases and architectures. See docs/PACKAGES.md.'
          fi
          gh release upload "$RELEASE_TAG" dist/*.deb dist/orqos-*-unknown-linux-gnu dist/manifest.json dist/SHA256SUMS --clobber
