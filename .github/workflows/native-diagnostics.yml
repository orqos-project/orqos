name: Native runtime diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install published runtime on disposable runner
        run: |
          curl -fL https://github.com/orqos-project/orqos/releases/download/v0.2.1/orqos-host_0.2.1_amd64.deb -o /tmp/orqos.deb
          sudo apt-get update
          sudo apt-get install -y /tmp/orqos.deb
          sudo cp host/*.py /usr/lib/orqos/
          sudo cp packaging/host-admin.py /usr/lib/orqos/admin.py
          sudo orqos-host-admin init
          sudo orqos-host-admin provision project-a
          sudo orqos-host-admin provision project-b
          sudo systemctl enable --now orqos-host
      - name: Exercise current execution helpers
        run: sudo -H env GITHUB_ACTIONS=true python3 packaging/runtime-smoke.py
